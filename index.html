        const formatMonthKey = (key) => {
            const [year, month] = key.split('-');

            if (!amount) return 0;
            const numAmount = parseFloat(amount);
            if (fromCurrency === toCurrency) return numAmount;
            if (fromCurrency === 'ZAR' && toCurrency === 'EUR') return numAmount / EUR_TO_ZAR;
            if (fromCurrency === 'EUR' && toCurrency === 'ZAR') return numAmount * EUR_TO_ZAR;
            return numAmount;
        };

                                    onChange={e => setSelectedMonth(e.target.value)}
                                    className="w-full p-4 rounded-2xl bg-slate-800 border-2 border-slate-700 focus:ring-2 focus:ring-indigo-500 font-bold text-sm mb-4 text-slate-200"
                                />
                                
                                <label className="text-[10px] font-black uppercase text-indigo-400 mb-3 block tracking-widest">
                                    Hours Worked
                                </label>
                                <div className="flex gap-3">
                                    <input 
                                        type="number" 
                                        step="0.5"
                                        value={hours}
                                        onChange={e => setHours(e.target.value)}
                                        placeholder="0.0"
                                        className="flex-1 p-4 rounded-2xl bg-slate-800 border-2 border-slate-700 focus:ring-2 focus:ring-indigo-500 font-bold text-lg text-slate-200"
                                    />
                                    <button 
                                        onClick={saveHours}
                                        className="px-8 bg-indigo-600 text-white rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg hover:bg-indigo-700 transition-all flex items-center gap-2"
                                    >
                                        <Icon name="Check" size={16} />
                                        Save
                                    </button>
                                </div>
                            </div>

                            {/* History */}
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-[10px] font-black uppercase text-slate-500 tracking-widest">History</h3>
                                    <div className="bg-slate-800 text-white px-4 py-2 rounded-xl border border-slate-700">
                                        <span className="text-[8px] font-black uppercase tracking-widest text-slate-400">Total: </span>
                                        <span className="text-lg font-black text-indigo-400">{totalHours.toFixed(1)}h</span>
                                    </div>
                                </div>
                                
                                {sortedMonths.length === 0 ? (
                                    <div className="py-12 bg-slate-800/50 rounded-3xl border-2 border-dashed border-slate-700 text-center">
                                        <Icon name="Clock" size={32} className="text-slate-600 mx-auto mb-3" />
                                        <p className="text-xs font-bold text-slate-500 uppercase tracking-widest">No hours logged yet</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {sortedMonths.map(monthKey => (
                                            <div key={monthKey} className="flex items-center justify-between p-5 bg-slate-800 rounded-2xl border border-slate-700 hover:border-indigo-700/50 transition-all group">
                                                <div className="flex items-center gap-4">
                                                    <div className="bg-indigo-900/50 p-3 rounded-xl border border-indigo-800/50">
                                                        <Icon name="Calendar" size={16} className="text-indigo-400" />
                                                    </div>
                                                    <div>
                                                        <p className="font-black text-sm text-slate-200">{formatMonthKey(monthKey)}</p>
                                                        <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                                                            {monthKey === getCurrentMonthKey() ? 'Current Month' : 'Past Record'}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="text-right">
                                                        <p className="text-2xl font-black text-indigo-400">{monthlyHours[monthKey]}</p>
                                                        <p className="text-[8px] font-black uppercase text-slate-500 tracking-widest">Hours</p>
                                                    </div>
                                                    <button 
                                                        onClick={() => deleteMonth(monthKey)}
                                                        className="p-2 text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all"
                                                    >
                                                        <Icon name="Trash" size={16} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="p-6 border-t border-slate-700 bg-slate-800/50">
                            <button 
                                onClick={onClose}
                                className="w-full bg-slate-800 text-white py-5 rounded-3xl font-black uppercase text-xs tracking-widest hover:bg-indigo-600 shadow-xl transition-all border border-slate-700"
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 5. MAIN APP ---
        function App() {
            const [user, setUser] = useState(null);
            const [clients, setClients] = useState([]);
            const [serviceGroups, setServiceGroups] = useState(DEFAULT_SERVICE_GROUPS);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState("");
            const [currency, setCurrency] = useState('ZAR'); // ZAR or EUR
            
            const [showModal, setShowModal] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showHoursModal, setShowHoursModal] = useState(false);
            const [showServiceComments, setShowServiceComments] = useState(false);
            const [selectedClient, setSelectedClient] = useState(null);
            const [selectedService, setSelectedService] = useState(null);
            const [editingClient, setEditingClient] = useState(null);

            const [form, setForm] = useState({
                name: "", tier: "P2", agency: "BV", proactive: "", retainerAmount: "", adSpend: "",
                services: {}, monthlyHours: {}, serviceComments: {}, baseCurrency: "ZAR"
            });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    if (u) setUser(u);
                    else auth.signInAnonymously();
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                const clientRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('clients');
                const settingsRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('settings').doc('services');

                const unsubClients = clientRef.onSnapshot(async (snap) => {
                    if (snap.empty) {
                        const batch = db.batch();
                        BASELINE_DATA.forEach(c => {
                            const newDoc = clientRef.doc();
                            batch.set(newDoc, { ...c, updatedAt: Date.now(), services: {}, monthlyHours: {}, serviceComments: {}, baseCurrency: "ZAR" });
                        });
                        await batch.commit();
                    }
                    setClients(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });

                const unsubSettings = settingsRef.onSnapshot(doc => {
                    if (doc.exists) setServiceGroups(doc.data().groups);
                    else settingsRef.set({ groups: DEFAULT_SERVICE_GROUPS });
                });

                return () => { unsubClients(); unsubSettings(); };
            }, [user]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                const ref = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('clients');
                const data = { ...form, updatedAt: Date.now(), baseCurrency: currency };
                if (editingClient) await ref.doc(editingClient.id).update(data);
                else await ref.add(data);
                closeModal();
            };

            const closeModal = () => {
                setForm({ name: "", tier: "P2", agency: "BV", proactive: "", retainerAmount: "", adSpend: "", services: {}, monthlyHours: {}, serviceComments: {}, baseCurrency: "ZAR" });
                setEditingClient(null); setShowModal(false);
            };

            const cycleServiceStatus = (opt) => {
                setForm(prev => {
                    const services = { ...(prev.services || {}) };
                    if (services[opt] === "well") services[opt] = "caution";
                    else if (services[opt] === "caution") services[opt] = "risk";
                    else services[opt] = "well";
                    return { ...prev, services };
                });
            };

            const removeServiceFromClient = (opt) => {
                setForm(prev => {
                    const services = { ...(prev.services || {}) };
                    delete services[opt];
                    return { ...prev, services };
                });
            };

            const addServiceToClient = (opt) => {
                setForm(prev => {
                    const services = { ...(prev.services || {}) };
                    if (!services[opt]) services[opt] = "well";
                    return { ...prev, services };
                });
            };

            const cleanupDuplicates = async () => {
                if (!confirm("Scan and remove duplicate account mappings?")) return;
                const db = firebase.firestore();
                const ref = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('clients');
                const snap = await ref.get();
                const seen = new Set();
                const toDelete = [];
                snap.docs.forEach(doc => {
                    const name = doc.data().name.toLowerCase().trim();
                    if (seen.has(name)) toDelete.push(doc.ref);
                    else seen.add(name);
                });
                const batch = db.batch();
                toDelete.forEach(r => batch.delete(r));
                await batch.commit();
                alert(`Successfully cleaned up ${toDelete.length} duplicates.`);
            };

            const openHoursModal = (client) => {
                setSelectedClient(client);
                setShowHoursModal(true);
            };

            const openServiceComments = (client, serviceName, e) => {
                e.stopPropagation();
                setSelectedClient(client);
                setSelectedService(serviceName);
                setShowServiceComments(true);
            };

            const getCurrentMonthHours = (client) => {
                const currentMonth = getCurrentMonthKey();
                return client.monthlyHours?.[currentMonth] || 0;
            };

            const toggleCurrency = () => {
                setCurrency(prev => prev === 'ZAR' ? 'EUR' : 'ZAR');
            };

            const displayAmount = (amount, clientBaseCurrency = 'ZAR') => {
                if (!amount) return formatCurrency(0, currency);
                const converted = convertCurrency(amount, clientBaseCurrency, currency);
                return formatCurrency(converted, currency);
            };

            const groupedClients = useMemo(() => {
                const filtered = clients.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()));
                return TIERS.reduce((acc, tier) => {
                    acc[tier.id] = filtered.filter(c => (c.tier || "x").includes(tier.id));
                    return acc;
                }, {});
            }, [clients, searchTerm]);

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-slate-950 gap-4">
                    <div className="w-12 h-12 border-4 border-slate-800 border-t-indigo-600 rounded-full animate-spin"></div>
                    <p className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-600">Loading Agency Roster</p>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col p-6 md:p-10 max-w-[1400px] mx-auto animate-in">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-16 gap-6">
                        <div className="flex items-center gap-4">
                            <div className="bg-indigo-600 p-3 rounded-2xl text-white shadow-xl"><Icon name="Users" size={28} /></div>
                            <div>
                                <h1 className="text-3xl font-black tracking-tighter text-slate-100 uppercase leading-none">Account Map</h1>
                                <p className="text-[10px] font-bold uppercase tracking-widest text-slate-500 mt-2">BV & SA Strategic Management</p>
                            </div>
                        </div>
                        
                        <div className="flex w-full md:w-auto gap-3">
                            <div className="flex-1 md:w-80 flex items-center bg-slate-800 px-4 rounded-2xl border border-slate-700 shadow-sm focus-within:ring-2 ring-indigo-500/20">
                                <Icon name="Search" className="text-slate-600 mr-2" />
                                <input type="text" placeholder="Search customer name..." className="w-full py-4 text-sm font-semibold border-none focus:ring-0 bg-transparent text-slate-200 placeholder-slate-600" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                            </div>
                            <button 
                                onClick={toggleCurrency}
                                className="p-4 bg-slate-800 border border-slate-700 rounded-2xl hover:bg-slate-700 transition-all text-slate-300 hover:text-indigo-400 font-black text-xs" 
                                title="Toggle Currency"
                            >
                                <div className="flex items-center gap-2">
                                    <Icon name="DollarSign" size={20} />
                                    <span>{currency}</span>
                                </div>
                            </button>
                            <button onClick={() => setShowSettings(true)} className="p-4 bg-slate-800 border border-slate-700 rounded-2xl hover:bg-slate-700 transition-all text-slate-400" title="Global Settings">
                                <Icon name="Settings" size={20} />
                            </button>
                            <button onClick={() => setShowModal(true)} className="bg-indigo-600 text-white px-8 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl hover:bg-indigo-700 transition-all flex items-center gap-2">
                                <Icon name="Plus" size={16} /> New Client
                            </button>
                        </div>
                    </header>

                    <div className="space-y-24">
                        {TIERS.map(tier => groupedClients[tier.id]?.length > 0 && (
                            <section key={tier.id} className="animate-in">
                                <div className="flex items-center gap-4 mb-8">
                                    <div className={`px-5 py-2 rounded-full ${tier.color} text-white font-black text-[10px] uppercase tracking-[0.2em] shadow-lg`}>{tier.label}</div>
                                    <div className="h-px bg-slate-800 flex-1"></div>
                                    <span className="text-[10px] font-black text-slate-600 uppercase tracking-widest">{groupedClients[tier.id].length} Accounts</span>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {groupedClients[tier.id].map(client => (
                                        <div key={client.id} className={`bg-slate-900 p-8 rounded-[2.5rem] shadow-sm border border-slate-800 flex flex-col relative transition-all hover:shadow-2xl hover:border-slate-700 group tier-card-${tier.id.toLowerCase()}`}>
                                            <div className="flex justify-between items-start mb-6">
                                                <div className="flex flex-wrap gap-1.5 max-w-[80%]">
                                                    <span className={`px-2.5 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest ${client.agency === 'SA' ? 'bg-indigo-900/50 text-indigo-400 border border-indigo-800/50' : 'bg-blue-900/50 text-blue-400 border border-blue-800/50'}`}>
                                                        {client.agency || "BV"}
                                                    </span>
                                                    {Object.entries(client.services || {}).map(([key, status]) => (
                                                        <button
                                                            key={key}
                                                            onClick={(e) => openServiceComments(client, key, e)}
                                                            className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-[9px] font-black uppercase tracking-tighter transition-all cursor-pointer hover:scale-105 ${
                                                                status === 'well' ? 'bg-emerald-900/30 border-emerald-800/50 text-emerald-400 hover:bg-emerald-900/50' : 
                                                                status === 'caution' ? 'bg-amber-900/30 border-amber-800/50 text-amber-400 hover:bg-amber-900/50' :
                                                                'bg-red-900/30 border-red-800/50 text-red-400 hover:bg-red-900/50'
                                                            }`}
                                                            title={`Click to add comments for ${key}`}
                                                        >
                                                            <div className={`w-1.5 h-1.5 rounded-full ${status === 'well' ? 'bg-emerald-500' : status === 'caution' ? 'bg-amber-500' : 'bg-red-500 animate-pulse'}`}></div>
                                                            {key}
                                                            {client.serviceComments?.[key] && (
                                                                <Icon name="MessageSquare" size={10} className="opacity-50" />
                                                            )}
                                                        </button>
                                                    ))}
                                                </div>
                                                <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={() => { setEditingClient(client); setForm(client); setShowModal(true); }} className="p-2 text-slate-600 hover:text-indigo-400 transition-colors"><Icon name="Edit" size={16}/></button>
                                                    <button onClick={() => { if(confirm("Permanently remove account?")) db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('clients').doc(client.id).delete(); }} className="p-2 text-slate-600 hover:text-red-400 transition-colors"><Icon name="Trash" size={16}/></button>
                                                </div>
                                            </div>

                                            <h3 className="text-2xl font-black text-slate-100 mb-4 leading-tight group-hover:text-indigo-400 transition-colors">{client.name}</h3>
                                            
                                            {/* HOURS TRACKING SECTION */}
                                            <button 
                                                onClick={() => openHoursModal(client)}
                                                className="w-full mb-6 bg-gradient-to-r from-indigo-900/30 to-purple-900/30 hover:from-indigo-900/50 hover:to-purple-900/50 p-4 rounded-2xl border-2 border-indigo-800/50 hover:border-indigo-700/50 transition-all group/hours"
                                            >
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-3">
                                                        <div className="bg-indigo-600 p-2 rounded-xl group-hover/hours:scale-110 transition-transform">
                                                            <Icon name="Clock" size={16} className="text-white" />
                                                        </div>
                                                        <div className="text-left">
                                                            <p className="text-[8px] font-black uppercase text-indigo-400 tracking-widest">This Month</p>
                                                            <p className="text-xl font-black text-indigo-300">{getCurrentMonthHours(client)}h</p>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-[7px] font-black uppercase text-slate-600 tracking-widest">View History</p>
                                                        <p className="text-[9px] font-bold text-indigo-400">→</p>
                                                    </div>
                                                </div>
                                            </button>

                                            {(client.retainerAmount || client.adSpend) && (
                                                <div className="flex gap-3 mb-6">
                                                    {client.retainerAmount && (
                                                        <div className="flex-1 bg-slate-800/50 p-2.5 rounded-xl border border-slate-800">
                                                            <p className="text-[7px] font-black uppercase text-slate-500 tracking-widest">Retainer</p>
                                                            <p className="text-[11px] font-extrabold text-slate-300">{displayAmount(client.retainerAmount, client.baseCurrency || 'ZAR')}</p>
                                                        </div>
                                                    )}
                                                    {client.adSpend && (
                                                        <div className="flex-1 bg-slate-800/50 p-2.5 rounded-xl border border-slate-800">
                                                            <p className="text-[7px] font-black uppercase text-slate-500 tracking-widest">Ad Spend</p>
                                                            <p className="text-[11px] font-extrabold text-indigo-400">{displayAmount(client.adSpend, client.baseCurrency || 'ZAR')}</p>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            <div className="space-y-4 flex-1 mb-8">
                                                {serviceGroups.map(group => client[group.id] && (
                                                    <div key={group.id} className="p-4 bg-slate-800/30 rounded-2xl border border-slate-800/50">
                                                        <p className="text-[9px] font-black uppercase text-slate-500 mb-1 tracking-widest flex items-center gap-1.5"><Icon name={group.icon} size={10} /> {group.label}</p>
                                                        <p className="text-[11px] font-bold text-slate-400 leading-relaxed italic">{client[group.id]}</p>
                                                    </div>
                                                ))}
                                            </div>

                                            {client.proactive && (
                                                <div className="mt-auto pt-6 border-t border-slate-800">
                                                    <p className="text-[9px] font-black uppercase text-indigo-400 mb-2 tracking-widest flex items-center gap-2"><Icon name="Check" size={10} /> Proactive Strategy</p>
                                                    <p className="text-[11px] text-slate-500 italic leading-relaxed">{client.proactive}</p>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </section>
                        ))}
                    </div>

                    {/* SERVICE COMMENTS MODAL */}
                    {showServiceComments && selectedClient && selectedService && (
                        <ServiceCommentsModal
                            client={selectedClient}
                            serviceName={selectedService}
                            onClose={() => {
                                setShowServiceComments(false);
                                setSelectedClient(null);
                                setSelectedService(null);
                            }}
                        />
                    )}

                    {/* HOURS MODAL */}
                    {showHoursModal && selectedClient && (
                        <HoursModal 
                            client={selectedClient}
                            onClose={() => {
                                setShowHoursModal(false);
                                setSelectedClient(null);
                            }}
                        />
                    )}

                    {/* ENTRY MODAL */}
                    {showModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md">
                            <div className="bg-slate-900 w-full max-w-5xl rounded-[3rem] shadow-2xl overflow-hidden animate-in border border-slate-700">
                                <div className="p-8 border-b border-slate-800 flex justify-between items-center bg-slate-800/50">
                                    <h2 className="text-xl font-black uppercase tracking-tighter text-slate-100">{editingClient ? 'Client Profile' : 'New Mapping'}</h2>
                                    <button onClick={closeModal} className="p-2 text-slate-500 hover:text-slate-200 transition-colors"><Icon name="X" size={24} /></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-10 grid grid-cols-1 lg:grid-cols-12 gap-8 max-h-[80vh] overflow-y-auto custom-scrollbar">
                                    <div className="lg:col-span-4 space-y-6">
                                        <div><label className="text-[10px] font-black uppercase text-slate-500 mb-2 block tracking-widest">Customer Name</label><input required type="text" className="w-full p-4 rounded-2xl bg-slate-800 border-none focus:ring-2 focus:ring-indigo-500 font-bold text-lg text-slate-200" value={form.name} onChange={e => setForm({...form, name: e.target.value})} /></div>
                                        
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-500 mb-2 block tracking-widest">Agency</label>
                                                <select className="w-full p-4 rounded-2xl bg-slate-800 border-none font-bold text-sm text-slate-200" value={form.agency} onChange={e => setForm({...form, agency: e.target.value})}>
                                                    {AGENCIES.map(a => <option key={a.id} value={a.id}>{a.label}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black uppercase text-slate-500 mb-2 block tracking-widest">Tier</label>
                                                <select className="w-full p-4 rounded-2xl bg-slate-800 border-none font-bold text-sm text-slate-200" value={form.tier} onChange={e => setForm({...form, tier: e.target.value})}>
                                                    {TIERS.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-black uppercase text-slate-500 mb-2 block tracking-widest">Retainer ({currency})</label><input type="number" className="w-full p-4 rounded-2xl bg-slate-800 border-none focus:ring-2 focus:ring-indigo-500 font-bold text-sm text-slate-200" value={form.retainerAmount} onChange={e => setForm({...form, retainerAmount: e.target.value})} placeholder="0.00" /></div>
                                            <div><label className="text-[10px] font-black uppercase text-slate-500 mb-2 block tracking-widest">Spend ({currency})</label><input type="number" className="w-full p-4 rounded-2xl bg-slate-800 border-none focus:ring-2 focus:ring-indigo-500 font-bold text-sm text-slate-200" value={form.adSpend} onChange={e => setForm({...form, adSpend: e.target.value})} placeholder="0.00" /></div>
                                        </div>

                                        <div><label className="text-[10px] font-black uppercase text-slate-500 mb-2 block tracking-widest">Strategic Goals</label><textarea rows={6} className="w-full p-4 rounded-2xl bg-slate-800 border-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold text-slate-200" value={form.proactive} onChange={e => setForm({...form, proactive: e.target.value})} placeholder="Strategic growth path..." /></div>
                                    </div>

                                    <div className="lg:col-span-8 space-y-8">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-500 block tracking-widest mb-4">Assigned Robot Inventory</label>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {Object.keys(form.services || {}).length === 0 ? (
                                                    <div className="col-span-2 py-10 bg-slate-800/50 rounded-[2rem] border-2 border-dashed border-slate-700 text-center">
                                                        <p className="text-xs font-bold text-slate-600 uppercase tracking-widest">No services assigned. Add from catalog below.</p>
                                                    </div>
                                                ) : Object.entries(form.services).map(([name, status]) => (
                                                    <div key={name} className={`flex items-center justify-between p-5 rounded-[2rem] border transition-all ${
                                                        status === 'well' ? 'bg-emerald-900/30 border-emerald-800/50' : 
                                                        status === 'caution' ? 'bg-amber-900/30 border-amber-800/50' : 'bg-red-900/30 border-red-800/50'
                                                    }`}>
                                                        <button type="button" onClick={() => cycleServiceStatus(name)} className="flex items-center gap-3 text-left">
                                                            <div className={`w-3 h-3 rounded-full ${status === 'well' ? 'bg-emerald-500' : status === 'caution' ? 'bg-amber-500' : 'bg-red-500 animate-pulse'}`}></div>
                                                            <div>
                                                                <p className={`font-black text-xs uppercase tracking-tight leading-none mb-1 ${status === 'well' ? 'text-emerald-400' : status === 'caution' ? 'text-amber-400' : 'text-red-400'}`}>{name}</p>
                                                                <p className={`text-[8px] font-black uppercase ${status === 'well' ? 'text-emerald-600' : status === 'caution' ? 'text-amber-600' : 'text-red-600'}`}>Status: {status}</p>
                                                            </div>
                                                        </button>
                                                        <button type="button" onClick={() => removeServiceFromClient(name)} className="p-2 text-slate-600 hover:text-red-400"><Icon name="Trash" size={14} /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="pt-8 border-t border-slate-800">
                                            <label className="text-[10px] font-black uppercase text-slate-500 block tracking-widest mb-4 flex items-center gap-2"><Icon name="Package" size={14} /> Global Catalog Selection</label>
                                            <div className="space-y-6">
                                                {serviceGroups.map(group => (
                                                    <div key={group.id} className="space-y-3">
                                                        <p className="text-[9px] font-black uppercase text-slate-600 tracking-[0.2em]">{group.label}</p>
                                                        <div className="flex flex-wrap gap-2">
                                                            {group.options.map(opt => (
                                                                <button 
                                                                    key={opt} type="button" 
                                                                    onClick={() => addServiceToClient(opt)}
                                                                    disabled={form.services?.[opt]}
                                                                    className={`px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition-all ${
                                                                        form.services?.[opt] ? 'bg-slate-800 text-slate-600 opacity-50 cursor-not-allowed border border-slate-700' : 'bg-slate-800 border border-slate-700 text-slate-400 hover:border-indigo-500 hover:text-indigo-400'
                                                                    }`}
                                                                >
                                                                    + {opt}
                                                                </button>
                                                            ))}
                                                        </div>
                                                        <input type="text" className="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold focus:ring-2 ring-indigo-500/20 text-slate-200" placeholder={`Specific notes for ${group.label}...`} value={form[group.id] || ""} onChange={e => setForm({...form, [group.id]: e.target.value})} />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                    <button className="lg:col-span-12 w-full bg-indigo-600 text-white py-6 rounded-3xl font-black uppercase text-xs tracking-[0.2em] shadow-xl hover:bg-indigo-700 transition-all mt-4">Save Mapping</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* SETTINGS MODAL */}
                    {showSettings && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md">
                            <div className="bg-slate-900 w-full max-w-2xl rounded-[3rem] shadow-2xl p-10 animate-in text-center border border-slate-700">
                                <h2 className="text-2xl font-black uppercase tracking-tighter mb-4 text-slate-100">System Management</h2>
                                <div className="bg-indigo-900/30 p-6 rounded-3xl mb-8 flex items-center justify-between border border-indigo-800/50">
                                    <div className="text-left"><p className="font-black text-indigo-300 text-sm uppercase">Deduplicate Data</p><p className="text-xs text-indigo-400/70">Cleanup duplicate client names in database.</p></div>
                                    <button onClick={cleanupDuplicates} className="px-6 py-3 bg-indigo-600 text-white rounded-xl font-black text-[10px] uppercase shadow-lg flex items-center gap-2 hover:bg-indigo-700"><Icon name="Sparkles" size={14} /> Run Cleanup</button>
                                </div>
                                <h3 className="text-left text-[10px] font-black uppercase text-slate-500 mb-4 tracking-widest">Global Master Catalog</h3>
                                <div className="space-y-4 text-left max-h-[40vh] overflow-y-auto px-2 custom-scrollbar">
                                    {serviceGroups.map((group, gIdx) => (
                                        <div key={group.id} className="p-5 bg-slate-800/50 rounded-3xl space-y-4 border border-slate-800">
                                            <div className="flex items-center gap-3"><Icon name={group.icon} className="text-indigo-400" size={16} /><span className="font-black text-sm uppercase tracking-tight text-slate-200">{group.label}</span></div>
                                            <div className="flex flex-wrap gap-2">
                                                {group.options.map((opt, oIdx) => (
                                                    <div key={opt} className="px-3 py-1 bg-slate-900 rounded-lg text-[10px] font-bold border border-slate-700 flex items-center gap-2 text-slate-300">
                                                        {opt}
                                                        <button onClick={() => {
                                                            const newGroups = [...serviceGroups];
                                                            newGroups[gIdx].options.splice(oIdx, 1);
                                                            setServiceGroups(newGroups);
                                                            db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('settings').doc('services').set({ groups: newGroups });
                                                        }} className="text-slate-600 hover:text-red-400"><Icon name="X" size={12} /></button>
                                                    </div>
                                                ))}
                                                <button onClick={() => {
                                                    const name = prompt("New Catalog Item:");
                                                    if (!name) return;
                                                    const newGroups = [...serviceGroups];
                                                    newGroups[gIdx].options.push(name);
                                                    setServiceGroups(newGroups);
                                                    db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('settings').doc('services').set({ groups: newGroups });
                                                }} className="px-3 py-1 bg-indigo-900/30 text-indigo-400 rounded-lg text-[10px] font-black border border-indigo-800/50 hover:bg-indigo-900/50 uppercase tracking-widest">+ Add</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setShowSettings(false)} className="mt-8 w-full bg-slate-800 text-white py-5 rounded-3xl font-black uppercase text-xs tracking-widest hover:bg-indigo-600 shadow-xl transition-all border border-slate-700">Close Settings</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
