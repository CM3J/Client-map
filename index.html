                                    className="px-6 py-3 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all font-semibold"
                                >
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- 5. HOURS MODAL ---
        function HoursModal({ client, onClose }) {
            const [monthlyHours, setMonthlyHours] = useState(client.monthlyHours || {});
            const [selectedMonth, setSelectedMonth] = useState(new Date().toLocaleString('default', { month: 'short', year: 'numeric' }));
            const [hoursInput, setHoursInput] = useState("");

            useEffect(() => {
                setHoursInput(monthlyHours[selectedMonth] || "");
            }, [selectedMonth, monthlyHours]);

            const saveHours = async () => {
                const updated = { ...monthlyHours, [selectedMonth]: parseFloat(hoursInput) || 0 };
                await firebase.firestore()
                    .collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection('clients').doc(client.id)
                    .update({ monthlyHours: updated });
                setMonthlyHours(updated);
            };

            const generateMonthOptions = () => {
                const months = [];
                const now = new Date();
                for (let i = 0; i < 12; i++) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    months.push(d.toLocaleString('default', { month: 'short', year: 'numeric' }));
                }
                return months;
            };

            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-2xl w-full">
                        <h2 className="text-2xl font-bold text-slate-100 mb-6">
                            Hours Tracker - {client.name}
                        </h2>

                        <div className="space-y-6">
                            {/* CURRENT MONTH INPUT */}
                            <div className="p-4 bg-slate-900 rounded-lg border border-slate-700">
                                <label className="block text-sm font-medium text-slate-300 mb-2">Select Month</label>
                                <select
                                    value={selectedMonth}
                                    onChange={e => setSelectedMonth(e.target.value)}
                                    className="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none mb-4"
                                >
                                    {generateMonthOptions().map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>

                                <label className="block text-sm font-medium text-slate-300 mb-2">Hours</label>
                                <div className="flex gap-2">
                                    <input
                                        type="number"
                                        value={hoursInput}
                                        onChange={e => setHoursInput(e.target.value)}
                                        className="flex-1 px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                        placeholder="0"
                                    />
                                    <button
                                        onClick={saveHours}
                                        className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-semibold"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>

                            {/* HISTORY */}
                            <div>
                                <h3 className="text-lg font-semibold text-slate-100 mb-3">History</h3>
                                <div className="space-y-2 max-h-64 overflow-y-auto custom-scrollbar">
                                    {Object.entries(monthlyHours)
                                        .sort((a, b) => new Date(b[0]) - new Date(a[0]))
                                        .map(([month, hours]) => (
                                            <div key={month} className="flex justify-between items-center p-3 bg-slate-900 rounded-lg border border-slate-700">
                                                <span className="text-slate-300">{month}</span>
                                                <span className="text-xl font-bold text-blue-400">{hours}h</span>
                                            </div>
                                        ))}
                                    {Object.keys(monthlyHours).length === 0 && (
                                        <p className="text-slate-500 text-center py-4">No hours logged yet</p>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="flex gap-3 mt-6">
                            <button
                                onClick={onClose}
                                className="flex-1 px-6 py-3 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all font-semibold"
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 6. SERVICE COMMENTS MODAL ---
        function ServiceCommentsModal({ client, serviceName, onClose }) {
            const [comments, setComments] = useState(client.serviceComments?.[serviceName] || "");
            const [isSaving, setIsSaving] = useState(false);

            const saveComments = async () => {
                setIsSaving(true);
                const updated = { ...(client.serviceComments || {}), [serviceName]: comments };
                await firebase.firestore()
                    .collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection('clients').doc(client.id)
                    .update({ serviceComments: updated });
                setIsSaving(false);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-2xl w-full">
                        <h2 className="text-2xl font-bold text-slate-100 mb-2">
                            {serviceName}
                        </h2>
                        <p className="text-slate-400 mb-6">{client.name}</p>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Notes & Comments</label>
                                <textarea
                                    value={comments}
                                    onChange={e => setComments(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none resize-none"
                                    rows="10"
                                    placeholder="Add notes about this service for this client..."
                                />
                            </div>

                            <div className="flex gap-3">
                                <button
                                    onClick={saveComments}
                                    disabled={isSaving}
                                    className="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-semibold disabled:opacity-50"
                                >
                                    {isSaving ? "Saving..." : "Save Notes"}
                                </button>
                                <button
                                    onClick={onClose}
                                    className="px-6 py-3 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all font-semibold"
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 7. ERROR REPORTS MODAL ---
        function ErrorReportsModal({ client, onClose }) {
            const [reports, setReports] = useState(client.errorReports || []);
            const [isSaving, setIsSaving] = useState(false);
            const [date, setDate] = useState(todayISO());
            const [severity, setSeverity] = useState("Medium");
            const [description, setDescription] = useState("");
            const [handledBy, setHandledBy] = useState("");
            const [resolution, setResolution] = useState("");

            const persist = async (updated) => {
                setIsSaving(true);
                setReports(updated);
                await firebase.firestore()
                    .collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection('clients').doc(client.id)
                    .update({ errorReports: updated });
                setIsSaving(false);
            };

            const addReport = async () => {
                if (!description.trim()) return;
                const entry = {
                    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                    date,
                    severity,
                    description: description.trim(),
                    handledBy: handledBy.trim(),
                    resolution: resolution.trim()
                };
                await persist([entry, ...reports]);
                setDescription("");
                setResolution("");
                setHandledBy("");
                setSeverity("Medium");
                setDate(todayISO());
            };

            const updateResolution = async (id, value) => {
                await persist(reports.map(r => r.id === id ? { ...r, resolution: value } : r));
            };

            const saveReport = async (id, patch) => {
                await persist(reports.map(r => r.id === id ? { ...r, ...patch } : r));
            };

            const deleteReport = async (id) => {
                if (!confirm("Delete this error report?")) return;
                await persist(reports.filter(r => r.id !== id));
            };

            const sorted = [...reports].sort((a, b) => new Date(b.date) - new Date(a.date));
            const openCount = reports.filter(r => !r.resolution || !r.resolution.trim()).length;

            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar">
                        <div className="flex items-start justify-between mb-2">
                            <h2 className="text-2xl font-bold text-slate-100">Error Log</h2>
                            {openCount > 0 && (
                                <span className="text-xs px-3 py-1 rounded-full bg-red-500/20 text-red-300 border border-red-500/30 font-medium">
                                    {openCount} unresolved
                                </span>
                            )}
                        </div>
                        <p className="text-slate-400 mb-6">{client.name}</p>

                        {/* ADD NEW REPORT */}
                        <div className="p-4 bg-slate-900 rounded-lg border border-slate-700 space-y-4 mb-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Date of error</label>
                                    <input
                                        type="date"
                                        value={date}
                                        onChange={e => setDate(e.target.value)}
                                        className="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Severity</label>
                                    <select
                                        value={severity}
                                        onChange={e => setSeverity(e.target.value)}
                                        className="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                    >
                                        {SEVERITY_LEVELS.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">What occurred *</label>
                                <textarea
                                    value={description}
                                    onChange={e => setDescription(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none resize-none"
                                    rows="3"
                                    placeholder="Describe the error…"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Handled by</label>
                                <input
                                    type="text"
                                    value={handledBy}
                                    onChange={e => setHandledBy(e.target.value)}
                                    className="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                    placeholder="Who dealt with it (optional)"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">How it was resolved</label>
                                <textarea
                                    value={resolution}
                                    onChange={e => setResolution(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none resize-none"
                                    rows="2"
                                    placeholder="Leave blank if not resolved yet"
                                />
                            </div>
                            <button
                                onClick={addReport}
                                disabled={isSaving || !description.trim()}
                                className="w-full px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-semibold disabled:opacity-50"
                            >
                                {isSaving ? "Saving…" : "Add Report"}
                            </button>
                        </div>

                        {/* HISTORY */}
                        <h3 className="text-lg font-semibold text-slate-100 mb-3">History ({reports.length})</h3>
                        <div className="space-y-3">
                            {sorted.length === 0 && (
                                <p className="text-slate-500 text-center py-4">No errors logged yet</p>
                            )}
                            {sorted.map(r => (
                                <ErrorReportEntry
                                    key={r.id}
                                    report={r}
                                    onSave={saveReport}
                                    onDelete={deleteReport}
                                    onQuickResolve={updateResolution}
                                />
                            ))}
                        </div>

                        <button
                            onClick={onClose}
                            className="w-full mt-6 px-6 py-3 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all font-semibold"
                        >
                            Close
                        </button>
                    </div>
                </div>
            );
        }

        // A single error-log entry with view and edit modes
        function ErrorReportEntry({ report, onSave, onDelete, onQuickResolve }) {
            const [editing, setEditing] = useState(false);
            const [date, setDate] = useState(report.date || todayISO());
            const [severity, setSeverity] = useState(report.severity || "Medium");
            const [description, setDescription] = useState(report.description || "");
            const [handledBy, setHandledBy] = useState(report.handledBy || "");
            const [resolution, setResolution] = useState(report.resolution || "");

            const startEdit = () => {
                setDate(report.date || todayISO());
                setSeverity(report.severity || "Medium");
                setDescription(report.description || "");
                setHandledBy(report.handledBy || "");
                setResolution(report.resolution || "");
                setEditing(true);
            };

            const save = () => {
                if (!description.trim()) return;
                onSave(report.id, {
                    date,
                    severity,
                    description: description.trim(),
                    handledBy: handledBy.trim(),
                    resolution: resolution.trim()
                });
                setEditing(false);
            };

            const resolved = report.resolution && report.resolution.trim();

            if (editing) {
                return (
                    <div className="p-4 bg-slate-900 rounded-lg border border-blue-500/40 space-y-3">
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">Date</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">Severity</label>
                                <select value={severity} onChange={e => setSeverity(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none">
                                    {SEVERITY_LEVELS.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-slate-400 mb-1">What occurred *</label>
                            <textarea value={description} onChange={e => setDescription(e.target.value)} rows="3" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none resize-none" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-slate-400 mb-1">Handled by</label>
                            <input type="text" value={handledBy} onChange={e => setHandledBy(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none" placeholder="Optional" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-slate-400 mb-1">Resolution</label>
                            <textarea value={resolution} onChange={e => setResolution(e.target.value)} rows="2" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none resize-none" placeholder="Leave blank if unresolved" />
                        </div>
                        <div className="flex gap-2">
                            <button onClick={save} disabled={!description.trim()} className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all text-sm font-semibold disabled:opacity-50">Save</button>
                            <button onClick={() => setEditing(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all text-sm font-semibold">Cancel</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 bg-slate-900 rounded-lg border border-slate-700">
                    <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-xs text-slate-400">{formatReportDate(report.date)}</span>
                            {report.severity && (
                                <span className={`text-xs px-2 py-0.5 rounded-full border ${SEVERITY_STYLES[report.severity] || SEVERITY_STYLES.Low}`}>{report.severity}</span>
                            )}
                            <span className={`text-xs px-2 py-0.5 rounded-full border ${resolved ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/30" : "bg-red-500/20 text-red-300 border-red-500/30"}`}>{resolved ? "Resolved" : "Open"}</span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                            <button onClick={startEdit} className="text-slate-400 hover:text-slate-200 text-sm" title="Edit">✏️</button>
                            <button onClick={() => onDelete(report.id)} className="text-red-400 hover:text-red-300 text-sm" title="Delete">✕</button>
                        </div>
                    </div>
                    <p className="text-sm text-slate-200 whitespace-pre-wrap mb-3">{report.description}</p>
                    {report.handledBy && report.handledBy.trim() && (
                        <p className="text-xs text-slate-500 mb-3">Handled by <span className="text-slate-300">{report.handledBy}</span></p>
                    )}
                    {resolved ? (
                        <div className="border-t border-slate-700 pt-2">
                            <p className="text-xs uppercase tracking-wide text-slate-500 mb-1">Resolution</p>
                            <p className="text-sm text-slate-400 whitespace-pre-wrap">{report.resolution}</p>
                        </div>
                    ) : (
                        <div className="border-t border-slate-700 pt-2">
                            <ResolutionEditor onSave={(val) => onQuickResolve(report.id, val)} />
                        </div>
                    )}
                </div>
            );
        }

        // Inline editor to add a resolution to an open report
        function ResolutionEditor({ onSave }) {
            const [value, setValue] = useState("");
            return (
                <div>
                    <p className="text-xs uppercase tracking-wide text-slate-500 mb-1">Add resolution</p>
                    <div className="flex gap-2">
                        <input
                            type="text"
                            value={value}
                            onChange={e => setValue(e.target.value)}
                            onKeyPress={e => { if (e.key === 'Enter' && value.trim()) onSave(value.trim()); }}
                            className="flex-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none"
                            placeholder="How was it resolved?"
                        />
                        <button
                            onClick={() => value.trim() && onSave(value.trim())}
                            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all text-sm font-semibold"
                        >
                            Resolve
                        </button>
                    </div>
                </div>
            );
        }

        // --- 8. RENDER ---
        ReactDOM.render(<ClientMapApp />, document.getElementById('root'));
    </script>

    <script type="text/html" id="social-src"><!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">@@SCRIPT_CLOSE@@
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js">@@SCRIPT_CLOSE@@
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js">@@SCRIPT_CLOSE@@
<style>
  :root{
    --navy:#0b1220;
    --navy-light:#1e293b;
    --heading:#f1f5f9;
    --slate:#94a3b8;
    --gold:#2563eb;
    --green:#10b981;
    --amber:#f59e0b;
    --red:#ef4444;
    --blue:#3b82f6;
    --teal:#06b6d4;
    --gray-soft:#334155;
    --bg:#0f172a;
    --card:#1e293b;
    --border:#334155;
    --text:#f1f5f9;
    --text-soft:#94a3b8;
    --input-bg:#0f172a;
    --focus-ring: rgba(37,99,235,0.35);
    --font-display:'Plus Jakarta Sans', sans-serif;
    --font-body:'Plus Jakarta Sans', sans-serif;
    --font-mono:'Plus Jakarta Sans', sans-serif;
  }
  html[data-theme="dark"]{
    --heading:#f1f5f9;
    --slate:#94a3b8;
    --gray-soft:#334155;
    --bg:#0f172a;

  body{ transition:background .2s, color .2s; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:white; }

  /* ---------- header ---------- */
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:14px;}
  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; color:var(--gold); font-weight:600; margin:0 0 4px; }
  h1{ font-family:var(--font-display); font-size:32px; font-weight:700; margin:0; color:var(--heading); letter-spacing:-0.01em;}

  /* ---------- pulse ---------- */

  }

let state = { clients: [], filterStatus: 'at-risk', search: '', sortMode: 'alpha', order: [], theme: 'dark', archiveOpen: false, activeClientId: null };
let saveTimer = null;

async function loadData(){
  try{
    const snap = await SOCIAL_DOC.get();
    if(snap.exists && snap.data() && Array.isArray(snap.data().clients)){
      const parsed = snap.data();
      state.clients = parsed.clients || [];
      state.order = parsed.order || state.clients.map(c=>c.id);
      state.sortMode = parsed.sortMode || 'alpha';
      state.theme = parsed.theme || 'dark';
    } else {
      state.clients = DEFAULT_CLIENTS;
      state.order = [...DEFAULT_CLIENTS].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>c.id);
      await persist();
    }
  } catch(e){
    state.clients = DEFAULT_CLIENTS;
    state.order = [...DEFAULT_CLIENTS].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>c.id);
    try{ await persist(); }catch(e2){ console.error(e2); }
  }
  document.documentElement.setAttribute('data-theme', state.theme);
  syncOrder();
  render();
}

function syncOrder(){
  const ids = state.clients.map(c=>c.id);
  state.order = state.order.filter(id => ids.includes(id));
  ids.forEach(id => { if(!state.order.includes(id)) state.order.push(id); });
}

function scheduleSave(){
  const indicator = document.getElementById('save-dot');
  if(indicator) indicator.classList.add('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    await persist();
    const ind = document.getElementById('save-dot');
    if(ind) ind.classList.remove('saving');
  }, 500);
}

async function persist(){
  try{
    await SOCIAL_DOC.set({clients: state.clients, order: state.order, sortMode: state.sortMode, theme: state.theme});
  }catch(e){ console.error('Save failed', e); }
}

function uid(){ return 'c_' + Math.random().toString(36).slice(2,9); }

function statusClass(status){
  const s = (status||'').toLowerCase();
  if(s.includes('active') && !s.includes('boost')) return 'st-active';
  if(s.includes('onboard')) return 'st-onboarding';
  if(s.includes('boost')) return 'st-boosting';
  if(s.includes('archive')) return 'st-archive';
  return 'st-unset';
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function gaugeFor(client){
  const days = daysUntil(client.nextPost);
  if(days === null) return {cls:'unknown', text:'Unscheduled'};
  if(days < 0) return {cls:'late', text: Math.abs(days)+'d overdue'};
  if(days <= 7) return {cls:'late', text: days+'d — start now'};
  if(days <= 14) return {cls:'warn', text: days+'d — coming up'};
  return {cls:'ok', text: days+'d buffer'};
}

function fmtDate(d){
  if(!d) return null;
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt.getTime())) return null;
  return dt.toLocaleDateString('en-ZA', {year:'numeric', month:'short', day:'numeric'});
}

function computePulse(){
  const clients = state.clients.filter(c => statusClass(c.status) !== 'st-archive');
  const totalWeek = clients.reduce((s,c)=>s + (parseInt(c.postsWeek)||0), 0);
  const totalMonth = clients.reduce((s,c)=>s + (parseInt(c.postsMonth)||0), 0);
  let allErrors = [];
  clients.forEach(c => (c.errorLog||[]).forEach(e => allErrors.push(e)));
  const errorCount = allErrors.length;
  let lastError = null;
  allErrors.forEach(e=>{
    if(e.date){
      const d = new Date(e.date+'T00:00:00');
      if(!isNaN(d) && (!lastError || d > lastError)) lastError = d;
    }
  });
  let daysNoError = '—';
  if(lastError){
    const today = new Date(); today.setHours(0,0,0,0);
    daysNoError = Math.max(0, Math.round((today - lastError)/86400000));
  }
  const atRisk = clients.filter(c=>{
    const g = gaugeFor(c);
    return g.cls === 'warn' || g.cls === 'late';
  }).length;
  return { totalWeek, totalMonth, clientCount: clients.length, errorCount, daysNoError, atRisk };
}

function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    : state.clients
        .filter(c => statusClass(c.status) !== 'st-archive')
        .filter(c => {
          if(state.filterStatus === 'all') return true;
          if(state.filterStatus === 'at-risk'){
            const g = gaugeFor(c);
            return g.cls === 'warn' || g.cls === 'late';
          }
          return statusClass(c.status)===state.filterStatus;
        })
        .filter(c => c.name.toLowerCase().includes(state.search.toLowerCase()))
        .sort((a,b)=> {
          if(state.filterStatus === 'at-risk'){
            const da = daysUntil(a.nextPost);
            const db = daysUntil(b.nextPost);
            if(da === null && db === null) return a.name.localeCompare(b.name);
            if(da === null) return 1;
            if(db === null) return -1;
            return da - db;
          }
          return a.name.localeCompare(b.name);
        })
  );

    </div>

    </div>

function renderClientRow(c){
  const g = gaugeFor(c);
  const isActive = state.activeClientId === c.id;
  return `
  <div class="client ${isActive?'active-row':''}" data-id="${c.id}">
    <div class="client-head" data-toggle="${c.id}">
      ${state.sortMode==='custom' ? `<span class="drag-handle" data-drag="${c.id}">⠿</span>` : `<span class="caret">›</span>`}
      <span class="cname">${escapeHtml(c.name) || 'Untitled client'}</span>
      <span class="badge ${statusClass(c.status)}">${escapeHtml(c.status)||'Unset'}</span>
      <span class="gauge"><span class="pip ${g.cls}"></span>${g.text}</span>
    </div>
  </div>`;
}

function updatePulseOnly(){
  const p = computePulse();
  const vals = document.querySelectorAll('.pulse .tval');
  if(vals.length >= 6){
    vals[0].textContent = p.totalWeek;
    vals[1].textContent = p.totalMonth;
    vals[2].textContent = p.clientCount;
    vals[3].textContent = p.atRisk;
    vals[4].textContent = p.errorCount;
    vals[5].textContent = p.daysNoError;
  }
}

    document.getElementById('panel-overlay').classList.add('show');
    document.getElementById('client-panel').classList.add('show');
  });
  document.querySelectorAll('.client').forEach(el=>el.classList.toggle('active-row', el.dataset.id === id));
}

function closeClientPanel(){
  document.getElementById('panel-overlay').classList.remove('show');
  document.getElementById('client-panel').classList.remove('show');
  document.querySelectorAll('.client').forEach(el=>el.classList.remove('active-row'));
  state.activeClientId = null;
}

function wirePanel(c){
  const panel = document.getElementById('client-panel');

  document.getElementById('panel-close').onclick = closeClientPanel;

  panel.querySelectorAll('[data-field]').forEach(input=>{
    const field = input.dataset.field;
    const eventType = (input.tagName==='SELECT'||input.type==='date') ? 'change' : 'input';
    input.addEventListener(eventType, ()=>{
      let val = input.value;
      if(field === 'postsWeek' || field === 'postsMonth') val = parseInt(val)||0;
      c[field] = val;
      scheduleSave();
      if(field === 'status' || field === 'nextPost' || field === 'name'){
        render();
        // re-apply active highlight + keep panel open on the same client
        document.querySelectorAll('.client').forEach(el=>el.classList.toggle('active-row', el.dataset.id === c.id));
      } else if(field === 'postsWeek' || field === 'postsMonth'){
        updatePulseOnly();
      }
    });
  });

  panel.querySelectorAll('[data-scope]').forEach(input=>{
    input.oninput = ()=>{
      c.scope = c.scope || {};
      c.scope[input.dataset.scope] = input.value;
      scheduleSave();
    };
  });

  panel.querySelectorAll('[data-err-idx]').forEach(input=>{
    const idx = parseInt(input.dataset.errIdx);
    const field = input.dataset.errField;
    input.addEventListener(input.tagName==='SELECT'?'change':'input', ()=>{
      c.errorLog[idx][field] = input.value;
      scheduleSave();
      updatePulseOnly();
    });
  });

  panel.querySelectorAll('[data-rm-err]').forEach(btn=>{
    btn.onclick = ()=>{
      c.errorLog.splice(parseInt(btn.dataset.rmErr),1);
      scheduleSave();
      renderPanel();
      updatePulseOnly();
    };
  });

  const addErrBtn = document.getElementById('add-err-btn');
  if(addErrBtn){
    addErrBtn.onclick = ()=>{
      c.errorLog = c.errorLog || [];
      c.errorLog.push({date:'', description:'', resolved:'N'});
      scheduleSave();
      renderPanel();
    };
  }
}

/* ============================= DRAG & DROP REORDER ============================= */

let dragState = null;

function wireDragAndDrop(){
  document.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.onpointerdown = (e)=>{
      e.preventDefault();
      const clientEl = handle.closest('.client');
      dragState = { id: handle.dataset.drag, targetId: null, before: true };
      clientEl.classList.add('dragging');
      document.addEventListener('pointermove', onDragPointerMove);
      document.addEventListener('pointerup', onDragPointerUp, { once: true });
    };
  });
}

function onDragPointerMove(e){
  if(!dragState) return;
  document.querySelectorAll('.client').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom'));
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const target = under ? under.closest('.client') : null;
  if(target && target.dataset.id !== dragState.id){
    const rect = target.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    target.classList.toggle('drag-over-top', before);
    target.classList.toggle('drag-over-bottom', !before);
    dragState.targetId = target.dataset.id;
    dragState.before = before;
  } else {
    dragState.targetId = null;
  }
}

function onDragPointerUp(){
  document.removeEventListener('pointermove', onDragPointerMove);
  document.querySelectorAll('.client').forEach(el=>el.classList.remove('dragging','drag-over-top','drag-over-bottom'));
  if(dragState && dragState.targetId){
    state.order = state.order.filter(id => id !== dragState.id);
    let idx = state.order.indexOf(dragState.targetId);
    if(idx === -1) idx = state.order.length;
    state.order.splice(dragState.before ? idx : idx + 1, 0, dragState.id);
    scheduleSave();
    render();
  }
  dragState = null;
}

function addClient(){
  const c = {
    id: uid(), name:'New Client', platforms:'', contact:'', calendarLink:'', finalPost:'', nextPost:'',

    lastpass:'Not yet confirmed', lastpassNotes:'', notes:'', errorLog:[]

  state.clients.push(c);
  state.order.push(c.id);
  scheduleSave();
  render();
  openClientPanel(c.id);
}

    <script>
      (function(){
        var tabs = document.querySelectorAll('.cmshell-tab');
        var panels = { clientmap: document.getElementById('tab-clientmap'), social: document.getElementById('tab-social') };
        var frame = document.getElementById('social-frame');
        var injected = false;
        function sizeFrame(){
          var bar = document.getElementById('cmshell-tabs');
          frame.style.height = (window.innerHeight - bar.offsetHeight) + 'px';
        }
        function injectSocial(){
          if(injected) return;
          var raw = document.getElementById('social-src').textContent;
          frame.srcdoc = raw.split('@@SCRIPT_CLOSE@@').join('</'+'script>');
          injected = true;
        }
        function activate(name){
          tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===name); });
          panels.clientmap.hidden = (name!=='clientmap');
          panels.social.hidden = (name!=='social');
          if(name==='social'){ injectSocial(); sizeFrame(); }
        }
        tabs.forEach(function(t){ t.onclick = function(){ activate(t.dataset.tab); }; });
        window.addEventListener('resize', function(){ if(!panels.social.hidden) sizeFrame(); });
        activate('clientmap');
      })();
    </script>
</body>
</html>
