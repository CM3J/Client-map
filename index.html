<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Map</title>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        
        .tier-card-p1 { border-top: 5px solid #7c3aed; }
        .tier-card-p2 { border-top: 5px solid #2563eb; }
        .tier-card-p3 { border-top: 5px solid #0891b2; }
        .tier-card-p4 { border-top: 5px solid #64748b; }
        .tier-card-x { border-top: 5px solid #334155; }
        .tier-card-archived { border-top: 5px solid #78716c; }
        
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
<style>
  #cmshell-tabs{ position:sticky; top:0; z-index:40; display:flex; gap:6px; align-items:center;
    padding:10px 16px; background:#0b1220; border-bottom:1px solid #1e293b; }
  .cmshell-tab{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:14px;
    padding:8px 18px; border-radius:8px; color:#94a3b8; background:transparent; border:none;
    cursor:pointer; transition:background .15s,color .15s; }
  .cmshell-tab:hover{ color:#e2e8f0; background:#1e293b; }
  .cmshell-tab.active{ color:#fff; background:#2563eb; }
  .cmshell-panel[hidden]{ display:none; }
  #social-frame{ width:100%; border:0; display:block; background:#0f172a; height:calc(100vh - 57px); }
</style>
</head>
<body>
    <div id="cmshell-tabs">
      <button class="cmshell-tab active" data-tab="clientmap">Client Map</button>
      <button class="cmshell-tab" data-tab="social">Social Media</button>
    </div>
    <div id="tab-clientmap" class="cmshell-panel">
      <div id="root"></div>
    </div>
    <div id="tab-social" class="cmshell-panel" hidden>
      <iframe id="social-frame" title="Social Media Dashboard"></iframe>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        // --- 1. FIREBASE INIT ---
        const firebaseConfig = {
            apiKey: "AIzaSyAAvxcoVE8ZpvG4OC5VKuNnfzuLxidL83U",
            authDomain: "points-dashboard-78c0b.firebaseapp.com",
            projectId: "points-dashboard-78c0b",
            storageBucket: "points-dashboard-78c0b.firebasestorage.app",
            messagingSenderId: "456742475224",
            appId: "1:456742475224:web:7b73cf082db54daa488ead"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const APP_ID = "client-map-master-v1";
        const DEFAULT_SERVICES = [
            "Google PPC", "Meta PPC", "LinkedIn PPC", "Display", "SEO", 
            "Social Media Mgmt", "Email Marketing", "CRO", "Creative Design", "Analytics & Reporting"
        ];

        const EUR_TO_ZAR = 20.5;

        // Local calendar date as YYYY-MM-DD (avoids UTC off-by-one for date inputs)
        const todayISO = () => {
            const d = new Date();
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        };

        const SEVERITY_LEVELS = ["Low", "Medium", "High", "Critical"];
        const SEVERITY_STYLES = {
            Low: "bg-slate-500/20 text-slate-300 border-slate-500/30",
            Medium: "bg-amber-500/20 text-amber-300 border-amber-500/30",
            High: "bg-orange-500/20 text-orange-300 border-orange-500/30",
            Critical: "bg-red-500/20 text-red-300 border-red-500/30"
        };

        // Format a YYYY-MM-DD string for display (local, no UTC shift)
        const formatReportDate = (d) => {
            if (!d) return "";
            const parsed = new Date(d + "T00:00:00");
            return isNaN(parsed) ? d : parsed.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        };

        const db = firebase.firestore();
        const auth = firebase.auth();

        // --- 2. MAIN APP ---
        function ClientMapApp() {
            const [user, setUser] = useState(null);
            const [clients, setClients] = useState([]);
            const [services, setServices] = useState(DEFAULT_SERVICES);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [showModal, setShowModal] = useState(false);
            const [showHoursModal, setShowHoursModal] = useState(false);
            const [showServiceComments, setShowServiceComments] = useState(false);
            const [showErrorReports, setShowErrorReports] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [newService, setNewService] = useState("");
            const [editingClient, setEditingClient] = useState(null);
            const [selectedClient, setSelectedClient] = useState(null);
            const [selectedService, setSelectedService] = useState(null);
            const [form, setForm] = useState({ 
                name: "", tier: "P2", agency: "BV", proactive: "", location: "", notes: "",
                retainerPercent: "", adSpend: "", services: {}, 
                monthlyHours: {}, serviceComments: {}, baseCurrency: "ZAR" 
            });

            // Authentication
            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    if (u) setUser(u);
                    else auth.signInAnonymously();
                });
                return () => unsub();
            }, []);

            // Load clients and services after authentication
            useEffect(() => {
                if (!user) return;
                const clientRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('clients');
                const servicesRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('settings').doc('services');
                
                const unsubClients = clientRef.onSnapshot(snap => {
                    setClients(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });

                const unsubServices = servicesRef.onSnapshot(snap => {
                    if (snap.exists && snap.data().list) {
                        setServices(snap.data().list);
                    } else {
                        // Initialize with defaults if doesn't exist
                        servicesRef.set({ list: DEFAULT_SERVICES });
                    }
                });

                return () => { unsubClients(); unsubServices(); };
            }, [user]);

            const addService = async () => {
                if (!newService.trim()) return;
                const updatedServices = [...services, newService];
                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('settings').doc('services').set({ list: updatedServices });
                setNewService("");
            };

            const removeService = async (serviceName) => {
                if (!confirm(`Remove "${serviceName}" from available services?`)) return;
                const updatedServices = services.filter(s => s !== serviceName);
                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('settings').doc('services').set({ list: updatedServices });
            };

            const tierOrder = { P1: 1, P2: 2, P3: 3, P4: 4, X: 5, Archived: 6 };

            // Filter by search, then sort by tier.
            const sortedClients = useMemo(() => {
                const q = search.trim().toLowerCase();
                const filtered = q
                    ? clients.filter(c => {
                        const haystack = [
                            c.name,
                            c.location,
                            c.agency,
                            c.proactive,
                            c.notes,
                            ...Object.keys(c.services || {}),
                            ...(c.errorReports || []).flatMap(r => [r.description, r.resolution])
                        ].filter(Boolean).join(" ").toLowerCase();
                        return haystack.includes(q);
                    })
                    : clients;
                return [...filtered].sort((a, b) => tierOrder[a.tier] - tierOrder[b.tier]);
            }, [clients, search]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!form.name.trim()) return;
                const db = firebase.firestore();
                const ref = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('clients');
                const data = {
                    ...form,
                    retainerPercent: parseFloat(form.retainerPercent) || 0,
                    adSpend: parseFloat(form.adSpend) || 0
                };
                if (editingClient) await ref.doc(editingClient.id).update(data);
                else await ref.add(data);
                closeModal();
            };

            const closeModal = () => {
                setForm({ 
                    name: "", tier: "P2", agency: "BV", proactive: "", location: "", notes: "",
                    retainerPercent: "", adSpend: "", services: {}, 
                    monthlyHours: {}, serviceComments: {}, baseCurrency: "ZAR" 
                });
                setEditingClient(null); 
                setShowModal(false);
            };

            const cycleServiceStatus = (opt) => {
                setForm(prev => {
                    const services = { ...(prev.services || {}) };
                    if (services[opt] === "well") services[opt] = "caution";
                    else if (services[opt] === "caution") services[opt] = "risk";
                    else services[opt] = "well";
                    return { ...prev, services };
                });
            };

            const removeServiceFromClient = (opt) => {
                setForm(prev => {
                    const services = { ...(prev.services || {}) };
                    delete services[opt];
                    return { ...prev, services };
                });
            };

            const addServiceToClient = (opt) => {
                setForm(prev => {
                    const services = { ...(prev.services || {}) };
                    if (!services[opt]) services[opt] = "well";
                    return { ...prev, services };
                });
            };

            const cleanupDuplicates = async () => {
                if (!confirm("Scan and remove duplicate account mappings?")) return;
                const db = firebase.firestore();
                const ref = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('clients');
                const snap = await ref.get();
                const seen = new Set();
                const toDelete = [];
                snap.docs.forEach(doc => {
                    const name = doc.data().name.toLowerCase().trim();
                    if (seen.has(name)) toDelete.push(doc.ref);
                    else seen.add(name);
                });
                const batch = db.batch();
                toDelete.forEach(r => batch.delete(r));
                await batch.commit();
                alert(`Successfully cleaned up ${toDelete.length} duplicates.`);
            };

            const openHoursModal = (client) => {
                setSelectedClient(client);
                setShowHoursModal(true);
            };

            const openServiceComments = (client, serviceName, e) => {
                e.stopPropagation();
                setSelectedClient(client);
                setSelectedService(serviceName);
                setShowServiceComments(true);
            };

            const openErrorReports = (client) => {
                setSelectedClient(client);
                setShowErrorReports(true);
            };

            const handleEdit = (client) => {
                setEditingClient(client);
                setForm(client);
                setShowModal(true);
            };

            const handleDelete = (client) => {
                if (confirm("Permanently remove account?")) {
                    firebase.firestore()
                        .collection('artifacts').doc(APP_ID)
                        .collection('public').doc('data')
                        .collection('clients').doc(client.id).delete();
                }
            };

            const tierColors = {
                P1: { bg: "bg-purple-500/10", text: "text-purple-400", border: "border-purple-500" },
                P2: { bg: "bg-blue-500/10", text: "text-blue-400", border: "border-blue-500" },
                P3: { bg: "bg-cyan-500/10", text: "text-cyan-400", border: "border-cyan-500" },
                P4: { bg: "bg-slate-500/10", text: "text-slate-400", border: "border-slate-500" },
                X: { bg: "bg-slate-700/10", text: "text-slate-500", border: "border-slate-700" },
                Archived: { bg: "bg-stone-500/10", text: "text-stone-400", border: "border-stone-500" }
            };

            const tierLabels = {
                P1: "Priority 1", P2: "Priority 2", P3: "Priority 3", 
                P4: "Priority 4", X: "Churned", Archived: "Archived"
            };

            if (loading) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center gap-4">
                        <div className="w-12 h-12 border-4 border-slate-800 border-t-blue-600 rounded-full animate-spin"></div>
                        <p className="text-xs font-bold uppercase tracking-widest text-slate-600">Loading Client Map</p>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-8">
                    {/* HEADER */}
                    <div className="max-w-7xl mx-auto mb-8">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-4xl font-bold text-slate-100 mb-2">Client Map</h1>
                                <p className="text-slate-400">Active client accounts & service portfolio</p>
                            </div>
                            <div className="flex gap-3">
                                <button 
                                    onClick={() => setShowSettings(true)}
                                    className="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all text-sm font-medium"
                                    title="Manage Services"
                                >
                                    ⚙️ Services
                                </button>
                                <button 
                                    onClick={cleanupDuplicates}
                                    className="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all text-sm font-medium"
                                >
                                    🧹 Cleanup Duplicates
                                </button>
                                <button 
                                    onClick={() => setShowModal(true)}
                                    className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-semibold shadow-lg shadow-blue-600/30"
                                >
                                    + Add Client
                                </button>
                            </div>
                        </div>

                        {/* SEARCH BAR */}
                        <div className="mt-6 relative">
                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">🔍</span>
                            <input
                                type="text"
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                placeholder="Search by name, location, agency, or service…"
                                className="w-full pl-11 pr-10 py-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none transition-colors"
                            />
                            {search && (
                                <button
                                    onClick={() => setSearch("")}
                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors"
                                    title="Clear search"
                                >
                                    ✕
                                </button>
                            )}
                        </div>
                    </div>

                    {/* TIER SECTIONS */}
                    <div className="max-w-7xl mx-auto space-y-8">
                        {["P1", "P2", "P3", "P4", "X", "Archived"].map(tier => {
                            const tierClients = sortedClients.filter(c => c.tier === tier);
                            if (tierClients.length === 0) return null;

                            return (
                                <div key={tier} className="animate-in">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className={`inline-flex items-center px-4 py-1.5 rounded-full text-sm font-semibold ${tierColors[tier].bg} ${tierColors[tier].text} border ${tierColors[tier].border}`}>
                                            {tierLabels[tier]} ({tierClients.length})
                                        </span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {tierClients.map(client => (
                                            <ClientCard 
                                                key={client.id}
                                                client={client}
                                                onEdit={handleEdit}
                                                onDelete={handleDelete}
                                                onOpenHours={openHoursModal}
                                                onOpenServiceComments={openServiceComments}
                                                onOpenErrors={openErrorReports}
                                            />
                                        ))}
                                    </div>
                                </div>
                            );
                        })}

                        {/* EMPTY / NO-RESULTS STATE */}
                        {sortedClients.length === 0 && (
                            <div className="text-center py-16 animate-in">
                                <p className="text-slate-400 text-lg">
                                    {search
                                        ? `No clients match "${search}".`
                                        : "No clients yet — add your first client to get started."}
                                </p>
                                {search && (
                                    <button
                                        onClick={() => setSearch("")}
                                        className="mt-4 px-4 py-2 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all text-sm font-medium"
                                    >
                                        Clear search
                                    </button>
                                )}
                            </div>
                        )}
                    </div>

                    {/* ADD/EDIT MODAL */}
                    {showModal && (
                        <ClientFormModal
                            form={form}
                            setForm={setForm}
                            services={services}
                            onSubmit={handleSubmit}
                            onClose={closeModal}
                            isEditing={!!editingClient}
                            cycleServiceStatus={cycleServiceStatus}
                            removeServiceFromClient={removeServiceFromClient}
                            addServiceToClient={addServiceToClient}
                        />
                    )}

                    {/* HOURS MODAL */}
                    {showHoursModal && selectedClient && (
                        <HoursModal
                            client={selectedClient}
                            onClose={() => {
                                setShowHoursModal(false);
                                setSelectedClient(null);
                            }}
                        />
                    )}

                    {/* SERVICE COMMENTS MODAL */}
                    {showServiceComments && selectedClient && selectedService && (
                        <ServiceCommentsModal
                            client={selectedClient}
                            serviceName={selectedService}
                            onClose={() => {
                                setShowServiceComments(false);
                                setSelectedClient(null);
                                setSelectedService(null);
                            }}
                        />
                    )}

                    {/* ERROR REPORTS MODAL */}
                    {showErrorReports && selectedClient && (
                        <ErrorReportsModal
                            client={selectedClient}
                            onClose={() => {
                                setShowErrorReports(false);
                                setSelectedClient(null);
                            }}
                        />
                    )}

                    {/* SETTINGS MODAL */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar">
                                <h2 className="text-2xl font-bold text-slate-100 mb-6">Manage Services</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-2">Add New Service</label>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={newService}
                                                onChange={e => setNewService(e.target.value)}
                                                onKeyPress={e => e.key === 'Enter' && addService()}
                                                className="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                                placeholder="e.g., Shopify Management"
                                            />
                                            <button
                                                onClick={addService}
                                                className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-semibold"
                                            >
                                                Add
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <h3 className="text-lg font-semibold text-slate-100 mb-3">Current Services ({services.length})</h3>
                                        <div className="space-y-2 bg-slate-900 rounded-lg p-4">
                                            {services.length === 0 ? (
                                                <p className="text-slate-500 text-sm">No services yet. Add one above!</p>
                                            ) : (
                                                services.map((service, idx) => (
                                                    <div key={idx} className="flex items-center justify-between p-3 bg-slate-800 rounded-lg border border-slate-700 hover:border-slate-600">
                                                        <span className="text-slate-300">{service}</span>
                                                        <button
                                                            onClick={() => removeService(service)}
                                                            className="text-red-400 hover:text-red-300 text-sm font-medium"
                                                        >
                                                            Remove
                                                        </button>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <ServicesAudit services={services} clients={clients} />

                                <button
                                    onClick={() => setShowSettings(false)}
                                    className="w-full mt-6 px-6 py-3 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all font-semibold"
                                >
                                    Close
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 2b. SERVICES AUDIT & RECONCILE ---
        function ServicesAudit({ services, clients }) {
            const [renameFrom, setRenameFrom] = useState("");
            const [renameTo, setRenameTo] = useState("");
            const [removeSvc, setRemoveSvc] = useState("");
            const [busy, setBusy] = useState(false);
            const [msg, setMsg] = useState("");

            const servicesDoc = firebase.firestore().collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('settings').doc('services');
            const clientsCol = firebase.firestore().collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('clients');

            // Compute usage: which clients carry each service
            const usage = {};
            clients.forEach(c => Object.keys(c.services || {}).forEach(n => {
                (usage[n] = usage[n] || []).push(c.name || 'Unnamed');
            }));
            const onCards = Object.keys(usage);
            const menuSet = new Set(services);
            const cardSet = new Set(onCards);
            const missing = onCards.filter(x => !menuSet.has(x)).sort();
            const unused = services.filter(x => !cardSet.has(x)).sort();
            const matched = services.filter(x => cardSet.has(x)).sort();
            const allKnown = [...new Set([...services, ...onCards])].sort();

            const flash = (t) => { setMsg(t); setTimeout(() => setMsg(""), 4000); };

            const rebuildFromCards = async () => {
                const list = [...new Set(onCards)].sort();
                if (!list.length) { flash("No services are on any card yet."); return; }
                if (!confirm(`Replace the menu with the ${list.length} services currently used on cards?\n\nThis changes ONLY the menu — client cards are not touched.`)) return;
                setBusy(true);
                try { await servicesDoc.set({ list }); flash(`Menu rebuilt from cards (${list.length} services).`); }
                catch (e) { console.error(e); flash("Failed — see console."); }
                setBusy(false);
            };

            const addMissing = async () => {
                if (!missing.length) { flash("Nothing to add — every card service is already in the menu."); return; }
                setBusy(true);
                try { await servicesDoc.set({ list: [...new Set([...services, ...onCards])].sort() }); flash(`Added ${missing.length} service(s) to the menu.`); }
                catch (e) { console.error(e); flash("Failed — see console."); }
                setBusy(false);
            };

            const removeMenuEntry = async (name) => {
                if (!confirm(`Remove "${name}" from the menu? No client uses it, so cards are unaffected.`)) return;
                setBusy(true);
                try { await servicesDoc.set({ list: services.filter(s => s !== name) }); flash(`Removed "${name}" from the menu.`); }
                catch (e) { console.error(e); flash("Failed — see console."); }
                setBusy(false);
            };

            const rename = async () => {
                const from = renameFrom, to = renameTo.trim();
                if (!from) { flash("Pick a service to rename."); return; }
                if (!to) { flash("Type the new name."); return; }
                if (from === to) { flash("The names are identical."); return; }
                const affected = clients.filter(c => (c.services && from in c.services) || (c.serviceComments && from in c.serviceComments));
                if (!confirm(`Rename "${from}" → "${to}" everywhere?\n\nUpdates the menu and ${affected.length} client(s). Where a client already has "${to}", the two are merged (existing status kept, notes combined).`)) return;
                setBusy(true);
                try {
                    await servicesDoc.set({ list: [...new Set(services.map(s => s === from ? to : s))] });
                    const batch = firebase.firestore().batch();
                    clients.forEach(c => {
                        let changed = false;
                        const svc = { ...(c.services || {}) };
                        const com = { ...(c.serviceComments || {}) };
                        if (from in svc) {
                            if (!(to in svc)) svc[to] = svc[from];
                            delete svc[from];
                            changed = true;
                        }
                        if (from in com) {
                            const oldC = com[from];
                            if (!com[to] || !String(com[to]).trim()) {
                                if (oldC && String(oldC).trim()) com[to] = oldC;
                            } else if (oldC && String(oldC).trim()) {
                                com[to] = String(com[to]) + "\n\n(merged from " + from + ")\n" + String(oldC);
                            }
                            delete com[from];
                            changed = true;
                        }
                        if (changed) batch.update(clientsCol.doc(c.id), { services: svc, serviceComments: com });
                    });
                    await batch.commit();
                    flash(`Renamed "${from}" → "${to}" (menu + ${affected.length} client(s)).`);
                    setRenameFrom(""); setRenameTo("");
                } catch (e) { console.error(e); flash("Failed — see console."); }
                setBusy(false);
            };

            const removeFromCards = async () => {
                const name = removeSvc;
                if (!name) { flash("Pick a service to remove from cards."); return; }
                const affected = clients.filter(c => c.services && name in c.services);
                if (!confirm(`Remove "${name}" from ALL ${affected.length} client card(s) and delete its notes? This cannot be undone.`)) return;
                setBusy(true);
                try {
                    const batch = firebase.firestore().batch();
                    clients.forEach(c => {
                        if (c.services && name in c.services) {
                            const svc = { ...c.services }; delete svc[name];
                            const com = { ...(c.serviceComments || {}) }; delete com[name];
                            batch.update(clientsCol.doc(c.id), { services: svc, serviceComments: com });
                        }
                    });
                    await batch.commit();
                    flash(`Removed "${name}" from ${affected.length} card(s).`);
                    setRemoveSvc("");
                } catch (e) { console.error(e); flash("Failed — see console."); }
                setBusy(false);
            };

            const aligned = missing.length === 0 && unused.length === 0;

            return (
                <div className="mt-8 pt-6 border-t border-slate-700">
                    <h3 className="text-lg font-semibold text-slate-100 mb-1">Audit & Reconcile</h3>
                    <p className="text-xs text-slate-500 mb-4">Compares the menu against the services actually used on client cards.</p>

                    {/* SUMMARY */}
                    <div className="flex flex-wrap gap-2 mb-4">
                        <span className="text-xs px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">{matched.length} matched</span>
                        <span className="text-xs px-3 py-1 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">{missing.length} on cards, not in menu</span>
                        <span className="text-xs px-3 py-1 rounded-full bg-slate-500/15 text-slate-300 border border-slate-500/30">{unused.length} in menu, unused</span>
                    </div>

                    {msg && (
                        <div className="mb-4 text-sm px-4 py-2 rounded-lg bg-blue-500/15 text-blue-200 border border-blue-500/30">{msg}</div>
                    )}

                    {aligned && (
                        <div className="mb-4 text-sm px-4 py-3 rounded-lg bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">
                            ✓ Menu and card services are fully aligned.
                        </div>
                    )}

                    {/* MISSING FROM MENU */}
                    {missing.length > 0 && (
                        <div className="mb-6 bg-slate-900 rounded-lg border border-slate-700 p-4">
                            <div className="flex items-center justify-between mb-3 gap-3 flex-wrap">
                                <p className="text-sm font-semibold text-amber-300">On cards but missing from the menu ({missing.length})</p>
                                <div className="flex gap-2">
                                    <button onClick={addMissing} disabled={busy} className="text-xs px-3 py-1.5 bg-slate-700 text-slate-200 rounded-lg hover:bg-slate-600 transition-all disabled:opacity-50">Add all to menu</button>
                                    <button onClick={rebuildFromCards} disabled={busy} className="text-xs px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-semibold disabled:opacity-50">Rebuild menu from cards</button>
                                </div>
                            </div>
                            <div className="space-y-1 max-h-56 overflow-y-auto custom-scrollbar pr-1">
                                {missing.map(name => (
                                    <div key={name} className="flex justify-between items-center text-xs">
                                        <span className="text-slate-200">{name}</span>
                                        <span className="text-slate-500">{usage[name].length} client{usage[name].length === 1 ? "" : "s"}</span>
                                    </div>
                                ))}
                            </div>
                            <p className="text-xs text-slate-500 mt-3">"Rebuild" replaces the menu with exactly the card services. "Add all" keeps existing menu entries too.</p>
                        </div>
                    )}

                    {/* UNUSED MENU ENTRIES */}
                    {unused.length > 0 && (
                        <div className="mb-6 bg-slate-900 rounded-lg border border-slate-700 p-4">
                            <p className="text-sm font-semibold text-slate-300 mb-3">In the menu but used by no client ({unused.length})</p>
                            <div className="space-y-1">
                                {unused.map(name => (
                                    <div key={name} className="flex justify-between items-center">
                                        <span className="text-xs text-slate-300">{name}</span>
                                        <button onClick={() => removeMenuEntry(name)} disabled={busy} className="text-xs text-red-400 hover:text-red-300 disabled:opacity-50">Remove</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* RENAME EVERYWHERE */}
                    <div className="mb-6 bg-slate-900 rounded-lg border border-slate-700 p-4">
                        <p className="text-sm font-semibold text-slate-300 mb-1">Rename a service everywhere</p>
                        <p className="text-xs text-slate-500 mb-3">Updates the menu and every card at once. Useful for merging duplicates (e.g. a service used by one client into the standard name).</p>
                        <div className="flex flex-col sm:flex-row gap-2">
                            <select value={renameFrom} onChange={e => setRenameFrom(e.target.value)} className="flex-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none">
                                <option value="">Select a service…</option>
                                {allKnown.map(s => <option key={s} value={s}>{s}{usage[s] ? ` (${usage[s].length})` : " (menu only)"}</option>)}
                            </select>
                            <input type="text" value={renameTo} onChange={e => setRenameTo(e.target.value)} placeholder="New name" className="flex-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none" />
                            <button onClick={rename} disabled={busy} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all text-sm font-semibold disabled:opacity-50">Rename</button>
                        </div>
                    </div>

                    {/* REMOVE FROM ALL CARDS */}
                    <div className="bg-slate-900 rounded-lg border border-slate-700 p-4">
                        <p className="text-sm font-semibold text-slate-300 mb-1">Remove a service from all cards</p>

                            <select value={removeSvc} onChange={e => setRemoveSvc(e.target.value)} className="flex-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none">
                                <option value="">Select a service…</option>
                                {onCards.slice().sort().map(s => <option key={s} value={s}>{s} ({usage[s].length})</option>)}
                            </select>
                            <button onClick={removeFromCards} disabled={busy} className="px-4 py-2 bg-red-600/80 text-white rounded-lg hover:bg-red-600 transition-all text-sm font-semibold disabled:opacity-50">Remove from cards</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 3. CLIENT CARD ---
        function ClientCard({ client, onEdit, onDelete, onOpenHours, onOpenServiceComments, onOpenErrors }) {
            const [displayCurrency, setDisplayCurrency] = useState(client.baseCurrency || "ZAR");

            const convertAmount = (amount, fromCurrency) => {
                if (!amount) return 0;
                if (displayCurrency === fromCurrency) return amount;
                if (fromCurrency === "EUR" && displayCurrency === "ZAR") return amount * EUR_TO_ZAR;
                if (fromCurrency === "ZAR" && displayCurrency === "EUR") return amount / EUR_TO_ZAR;
                return amount;
            };

            const retainerDisplay = convertAmount(client.retainerPercent || 0, client.baseCurrency || "ZAR");
            const spendDisplay = convertAmount(client.adSpend || 0, client.baseCurrency || "ZAR");

            const serviceStatusColors = {
                well: "bg-emerald-500/20 text-emerald-300 border-emerald-500/30",
                caution: "bg-amber-500/20 text-amber-300 border-amber-500/30",
                risk: "bg-red-500/20 text-red-300 border-red-500/30"

            const currentMonth = new Date().toLocaleString('default', { month: 'short', year: 'numeric' });
            const currentHours = client.monthlyHours?.[currentMonth] || 0;
            const monthlyEntries = Object.entries(client.monthlyHours || {})
                .filter(([, hours]) => hours)
                .sort((a, b) => new Date(b[0]) - new Date(a[0]));

            const errorReports = client.errorReports || [];
            const openErrors = errorReports.filter(r => !r.resolution || !r.resolution.trim()).length;

            const toggleCurrency = () => {
                setDisplayCurrency(prev => prev === "ZAR" ? "EUR" : "ZAR");
            };

            return (
                <div className={`tier-card-${client.tier.toLowerCase()} bg-slate-800/50 backdrop-blur-sm border border-slate-700 rounded-xl p-6 hover:shadow-xl hover:shadow-slate-900/50 transition-all group`}>

                    <div className="flex items-start justify-between mb-4">
                        <div>
                            <h3 className="text-xl font-bold text-slate-100 mb-1">{client.name}</h3>
                            <div className="flex items-center gap-2">
                                <span className="text-xs px-2 py-1 bg-slate-700 text-slate-300 rounded">
                                    {client.agency}
                                </span>
                                {client.proactive && (
                                    <span className="text-xs px-2 py-1 bg-blue-600/20 text-blue-300 rounded border border-blue-500/30">
                                        {client.proactive}
                                    </span>
                                )}
                            </div>
                            {client.location && (
                                <div className="flex items-center gap-1 mt-2 text-xs text-slate-400">
                                    <span>📍</span>
                                    <span>{client.location}</span>
                                </div>
                            )}
                        </div>
                        <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onClick={() => onEdit(client)} className="p-2 hover:bg-slate-700 rounded-lg transition-colors">
                                <span className="text-slate-400">✏️</span>
                            </button>
                            <button onClick={() => onDelete(client)} className="p-2 hover:bg-slate-700 rounded-lg transition-colors">
                                <span className="text-red-400">🗑️</span>
                            </button>
                        </div>
                    </div>

                    {/* FINANCIALS */}
                    <div className="grid grid-cols-2 gap-4 mb-4 p-4 bg-slate-900/50 rounded-lg border border-slate-700">
                        <div className="relative">
                            <p className="text-xs text-slate-500 mb-1">Retainer % MRR</p>
                            <p className="text-lg font-bold text-slate-100">
                                {retainerDisplay > 0 ? `${retainerDisplay.toFixed(0)}%` : "—"}
                            </p>
                        </div>
                        <div className="relative">
                            <p className="text-xs text-slate-500 mb-1">Ad Spend</p>
                            <p className="text-lg font-bold text-slate-100">
                                {spendDisplay > 0 ? `${displayCurrency} ${spendDisplay.toLocaleString(undefined, {maximumFractionDigits: 0})}` : "—"}
                            </p>
                        </div>
                        <div className="col-span-2 flex justify-center">
                            <button
                                onClick={toggleCurrency}
                                className="text-xs px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded transition-colors"
                            >
                                💱 {displayCurrency}
                            </button>
                        </div>
                    </div>

                    {/* HOURS TRACKER */}
                    <div 
                        onClick={() => onOpenHours(client)}
                        className="mb-4 p-4 bg-slate-900/50 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500/50 transition-all"
                    >
                        <div className="flex items-center justify-between">
                            <div>
                                <p className="text-xs text-slate-500 mb-1">Hours This Month ({currentMonth})</p>
                                <p className="text-2xl font-bold text-blue-400">{currentHours}h</p>
                            </div>
                            <span className="text-2xl">⏱️</span>
                        </div>

                        {monthlyEntries.length > 0 && (
                            <div className="mt-3 pt-3 border-t border-slate-700/70">
                                <p className="text-xs text-slate-500 mb-2 font-semibold">Time per month</p>
                                <div className="space-y-1 max-h-32 overflow-y-auto custom-scrollbar pr-1">
                                    {monthlyEntries.map(([month, hours]) => (
                                        <div key={month} className="flex justify-between items-center text-xs">
                                            <span className={month === currentMonth ? "text-blue-300 font-medium" : "text-slate-400"}>{month}</span>
                                            <span className={month === currentMonth ? "text-blue-300 font-semibold" : "text-slate-300"}>{hours}h</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <p className="text-xs text-slate-500 mt-2">Click to view history & log hours</p>
                    </div>

                    {/* ERROR LOG */}
                    <div
                        onClick={() => onOpenErrors(client)}
                        className="mb-4 p-3 bg-slate-900/50 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500/50 transition-all flex items-center justify-between"
                    >
                        <div className="flex items-center gap-2">
                            <span className="text-lg">🐞</span>
                            <span className="text-xs font-semibold text-slate-400">Error Log</span>
                        </div>
                        <div className="flex items-center gap-2">
                            {openErrors > 0 && (
                                <span className="text-xs px-2 py-0.5 rounded-full bg-red-500/20 text-red-300 border border-red-500/30">
                                    {openErrors} open
                                </span>
                            )}
                            <span className="text-xs text-slate-500">{errorReports.length} logged</span>
                        </div>
                    </div>

                    {/* SERVICES */}
                    {Object.keys(client.services || {}).length > 0 && (
                        <div>
                            <p className="text-xs text-slate-500 mb-2 font-semibold">Active Services</p>
                            <div className="flex flex-wrap gap-2">
                                {Object.entries(client.services).map(([service, status]) => (
                                    <button
                                        key={service}
                                        onClick={(e) => onOpenServiceComments(client, service, e)}
                                        className={`text-xs px-3 py-1.5 rounded-full border transition-all hover:scale-105 ${serviceStatusColors[status]}`}
                                    >
                                        {service}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* NOTES */}
                    {client.notes && (
                        <div className="mt-4 pt-4 border-t border-slate-700">
                            <p className="text-xs text-slate-500 mb-2 font-semibold">Notes</p>
                            <p className="text-sm text-slate-300 whitespace-pre-wrap max-h-32 overflow-y-auto custom-scrollbar pr-1">{client.notes}</p>
                        </div>
                    )}
                </div>
            );
        }

        // --- 4. FORM MODAL ---
        function ClientFormModal({ form, setForm, services, onSubmit, onClose, isEditing, cycleServiceStatus, removeServiceFromClient, addServiceToClient }) {
            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar">

                            {isEditing ? "Edit Client" : "Add New Client"}

                        <form onSubmit={onSubmit} className="space-y-6">

                                        type="text"

                                    >
                                        <option value="P1">Priority 1</option>
                                        <option value="P2">Priority 2</option>
                                        <option value="P3">Priority 3</option>
                                        <option value="P4">Priority 4</option>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Agency</label>
                                    <select
                                        value={form.agency}
                                        onChange={e => setForm({...form, agency: e.target.value})}
                                        className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"

                                        <option value="BV">BV</option>
                                        <option value="DN">DN</option>

                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Proactive</label>
                                    <input
                                        type="text"
                                        value={form.proactive}
                                        onChange={e => setForm({...form, proactive: e.target.value})}
                                        className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                        placeholder="Optional"
                                    />
                                </div>
                            </div>

                            {/* LOCATION */}
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Location</label>
                                <input
                                    type="text"
                                    value={form.location || ""}
                                    onChange={e => setForm({...form, location: e.target.value})}
                                    className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                    placeholder="e.g., Cape Town, South Africa"
                                />
                            </div>

                            {/* FINANCIALS */}
                            <div className="grid grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Base Currency</label>
                                    <select
                                        value={form.baseCurrency}
                                        onChange={e => setForm({...form, baseCurrency: e.target.value})}
                                        className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                    >
                                        <option value="ZAR">ZAR</option>
                                        <option value="EUR">EUR</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Retainer % MRR</label>
                                    <input
                                        type="number"
                                        value={form.retainerPercent}
                                        onChange={e => setForm({...form, retainerPercent: e.target.value})}
                                        className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                        placeholder="0"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Ad Spend</label>
                                    <input
                                        type="number"
                                        value={form.adSpend}
                                        onChange={e => setForm({...form, adSpend: e.target.value})}
                                        className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none"
                                        placeholder="0"
                                    />
                                </div>
                            </div>

                            {/* SERVICES */}
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Services</label>
                                <div className="space-y-2">
                                    {Object.entries(form.services || {}).map(([service, status]) => (
                                        <div key={service} className="flex items-center gap-2 p-3 bg-slate-900 rounded-lg border border-slate-700">
                                            <span className="flex-1 text-slate-100">{service}</span>
                                            <button
                                                type="button"
                                                onClick={() => cycleServiceStatus(service)}
                                                className={`px-3 py-1 rounded text-xs font-medium ${
                                                    status === "well" ? "bg-emerald-500/20 text-emerald-300" :
                                                    status === "caution" ? "bg-amber-500/20 text-amber-300" :
                                                    "bg-red-500/20 text-red-300"
                                                }`}
                                            >
                                                {status === "well" ? "✓ Well" : status === "caution" ? "⚠ Caution" : "⚠️ Risk"}
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => removeServiceFromClient(service)}
                                                className="text-red-400 hover:text-red-300"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-3">
                                    <p className="text-xs text-slate-500 mb-2">Add Services:</p>
                                    <div className="flex flex-wrap gap-2">

                                            >
                                                + {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* NOTES */}
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Notes</label>
                                <textarea
                                    value={form.notes || ""}
                                    onChange={e => setForm({...form, notes: e.target.value})}
                                    className="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none resize-none"
                                    rows="4"
                                    placeholder="General notes about this client…"
                                />
                            </div>

                            {/* BUTTONS */}
                            <div className="flex gap-3 pt-4">
                                <button
                                    type="submit"
                                    className="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-semibold"

                                <button
                                    type="button"
